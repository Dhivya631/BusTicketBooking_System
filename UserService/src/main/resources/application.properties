server.port=8081
spring.application.name=USER-SERVICE

# register client in  eureka server
eureka.client.serviceUrl.defaultZone = http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true


#postgresql db
spring.datasource.url=jdbc:postgresql://localhost:5432/busticket
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

#logs the sql stmt generated by hibernate at debug level
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=trace
app.jwt-secret=${JWT_SECRET}
app-jwt-expiration-milliseconds=604800000

spring.web.resources.static-locations=classpath:/static/

#cloud config server
spring.cloud.config.uri=http://localhost:8888

management.endpoints.web.exposure.include=*
management.health.circuitbreakers.enabled=true
management.endpoint.circuitbreakers.enabled=true

#circuitbreaker
resilience4j.circuitbreaker.instances.busService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.busService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.busService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.busService.failureRateThreshold=10
resilience4j.circuitbreaker.instances.busService.waitDurationInOpenState=5000ms
resilience4j.circuitbreaker.instances.busService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.busService.slowCallDurationThreshold=2000ms
resilience4j.circuitbreaker.instances.busService.slowCallRateThreshold=50

resilience4j.circuitbreaker.instances.bookingService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.bookingService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.bookingService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.bookingService.failureRateThreshold=10
resilience4j.circuitbreaker.instances.bookingService.waitDurationInOpenState=5000ms
resilience4j.circuitbreaker.instances.bookingService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.bookingService.slowCallDurationThreshold=2000ms
resilience4j.circuitbreaker.instances.bookingService.slowCallRateThreshold=50

resilience4j.circuitbreaker.instances.userService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.userService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=10
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=5000ms
resilience4j.circuitbreaker.instances.userService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.userService.slowCallDurationThreshold=2000ms
resilience4j.circuitbreaker.instances.userService.slowCallRateThreshold=50

logging.level.io.github.resilience4j.circuitbreaker=DEBUG

spring.profiles.active=dev

spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0
