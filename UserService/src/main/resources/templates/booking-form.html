<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <title>Booking bus</title>
    <style>
        body{
               background-image:url('/img/user/pic.jpg');
               background-repeat:no-repeat;
               background-size:cover;
               height: 100vh;
               margin: 0;
               font-family:Times New Roman;
        }
         h3{
           font-family:Times New Roman;
         }
        .form-container{
             width:50%;
             margin: 5 auto;
             padding-left:20px;
         }
         .container{
             padding-top:50px;
         }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
        <a class="navbar-brand" href="#">Bus Ticket Booking System</a>
        <ul class="navbar-nav mr-auto mt-2 mt-lg-0">
            <li class="nav-item active">
                <a class="nav-link" href="/api/customer/homePage">Home <span class="sr-only">(current)</span></a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    Register
                </a>
                <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                    <a class="dropdown-item" href="/api/customer/register">Customer</a>
                </div>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink1" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    Login
                </a>
                <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                    <a class="dropdown-item" href="/api/customer/login">User</a>
                    <a class="dropdown-item" href="/api/admin/login">Admin</a>
                </div>
            </li>
        </ul>
    </div>
</nav>
<div class="container">
    <h3>Book Bus</h3>
    <div class="card form-container"> <!-- Set width to 50% and center the form -->
        <div class="card-body">
            <form th:action="@{/api/booking/book}" method="post">
                <div class="alert alert-success" id="successMessage" style="display: none;">
                </div>
                <input type="hidden" name="busNumber" th:value="${bus.busNumber}">
                <input type="hidden" name="scheduleId" th:value="${bus.schedules[0].scheduleId}">
                <!-- Row 1: User Details -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="name">UserName:</label>
                            <input type="text" class="form-control" id="name" th:value="${user.name}" readonly>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="phoneno">Phone Number:</label>
                            <input type="text" class="form-control" id="phoneno" th:value="${user.phoneno}" readonly>
                        </div>
                    </div>
                </div>

                <!-- Row 2: Email and Bus Number -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="email">Email Address:</label>
                            <input type="email" class="form-control" id="email" th:value="${user.email}" readonly>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="busNumber">Bus Number:</label>
                            <input type="text" class="form-control" id="busNumber" th:value="${bus.busNumber}" readonly>
                        </div>
                    </div>
                </div>

                <!-- Row 3: Origin and Destination -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="origin">Origin:</label>
                            <input type="text" class="form-control" id="origin" th:value="${bus.schedules[0].origin}" readonly>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="destination">Destination:</label>
                            <input type="text" class="form-control" id="destination" th:value="${bus.schedules[0].destination}" readonly>
                        </div>
                    </div>
                </div>

                <!-- Row 4: Schedule and Seat Number -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="scheduleId">Schedule:</label>
                            <input type="text" class="form-control" id="scheduleId" th:value="${bus.schedules[0].departureTime + ' - ' + bus.schedules[0].arrivalTime}" readonly>
                            <!--              <select class="form-control" id="scheduleId" name="scheduleId" required>-->
                            <!--                <option th:each="schedule : ${bus.schedules}" th:value="${schedule.scheduleId}" th:text="${schedule.departureTime + ' - ' + schedule.arrivalTime}"></option>-->
                            <!--              </select>-->
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="seatNumber">Seat Number:</label>
                            <select name="seatNumber" id="seatNumber" class="form-control" required>
                                <option th:each="seat : ${availableSeats}" th:value="${seat}" th:text="${seat}"></option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="fare">Fare:</label>
                            <input type="text" class="form-control" id="fare" name="fare" th:value="${bus.schedules[0].fare}" readonly>
                        </div>
                    </div>
                </div>
                <!-- Submit Button -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Confirm Booking</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
