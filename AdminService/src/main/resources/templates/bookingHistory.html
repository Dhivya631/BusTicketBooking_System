<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <title>Booking History</title>
    <style>
        body {
            font-family:Times New Roman;
        }
        h3 {
            padding-top:20px;
            color: black;
            text-align:center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: black;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .center{
            padding-top:20px;
            text-align:center;
        }
    </style>
    <script>
        function confirmCancel() {
            if (confirm("Are you sure you want to cancel this booking?")) {
                document.getElementById('cancelForm').submit();
            }
        }
    </script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
        <a class="navbar-brand" href="#">Bus Ticket Booking System</a>
        <ul class="navbar-nav mr-auto mt-2 mt-lg-0">
            <li class="nav-item active">
                <a class="nav-link" href="/api/admin/homePage">Home <span class="sr-only">(current)</span></a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    Register
                </a>
                <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                    <a class="dropdown-item" href="/api/customer/register">Customer</a>
                </div>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink1" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    Login
                </a>
                <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                    <a class="dropdown-item" href="/api/customer/login">Customer</a>
                    <a class="dropdown-item" href="/api/admin/login">Admin</a>
                </div>
            </li>
        </ul>
    </div>
</nav>
<h3>Booking History</h3>
<table>
    <thead>
    <tr>
        <th>Booking ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Bus Number</th>
        <th>Origin</th>
        <th>Destination</th>
        <th>Arrival time</th>
        <th>Departure Time</th>
        <th>Seat Number</th>
        <th>Booking Date</th>
        <th>Payment Status</th>
        <th>Fare</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="booking : ${bookings}">
        <td th:text="${booking.id}"></td>
        <td th:text="${booking.name}"></td>
        <td th:text="${booking.email}"></td>
        <td th:text="${booking.busNumber}"></td>
        <td th:text="${booking.origin}"></td>
        <td th:text="${booking.destination}"></td>
        <td th:text="${booking.arrivalTime}"></td>
        <td th:text="${booking.departureTime}"></td>
        <td th:text="${booking.seatNumber}"></td>
        <td th:text="${booking.bookingDate}"></td>
        <td th:text="${booking.paymentStatus}"></td>
        <td th:text="${booking.fare}"></td>
        <td>
            <form id="cancelForm" th:action="@{/api/admin/booking/{id}/cancel(id=${booking.id})}" method="post">
                <input type="hidden" name="redirecturl" value="/api/admin/booking-history">
                <button type="button" class="btn btn-danger" onclick="confirmCancel()">Cancel</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<div class="center">
    <a href="/api/admin/dash">Back to admin dashboard</a>
</div>
</body>
</html>
